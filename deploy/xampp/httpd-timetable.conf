# =============================================================================
# SAFE ADD-ON for XAMPP Apache — UR Timetable at http://localhost/timetable
# =============================================================================
# WHAT THIS DOES
#   - Adds ONLY /timetable (UI) and /timetable/api (Node backend proxy)
#   - Does NOT change DocumentRoot
#   - Does NOT touch any other folder under htdocs
#
# HOW TO INSTALL (on the XAMPP server only)
#   1. Copy built frontend files into:  C:/xampp/htdocs/timetable/
#      (create that folder; leave every other htdocs project alone)
#   2. Ensure Node backend is running on 127.0.0.1:9000
#   3. Copy this file to:  C:/xampp/apache/conf/extra/httpd-timetable.conf
#   4. In C:/xampp/apache/conf/httpd.conf add ONE new line near other Includes:
#        Include conf/extra/httpd-timetable.conf
#   5. Confirm these modules are enabled (usually already on in XAMPP):
#        LoadModule proxy_module modules/mod_proxy.so
#        LoadModule proxy_http_module modules/mod_proxy_http.so
#        LoadModule rewrite_module modules/mod_rewrite.so
#   6. Restart Apache in XAMPP Control Panel
#
# TO REMOVE LATER (zero impact on PHP apps)
#   - Comment out / delete the Include line
#   - Delete C:/xampp/htdocs/timetable/
#   - Restart Apache
#
# CONFLICT WARNING
#   If htdocs/timetable already exists as an OLD PHP app, either:
#     A) Rename that PHP folder (e.g. timetable-php-old), OR
#     B) Change Alias /timetable below to /ur-timetable and rebuild with
#        VITE_BASE_PATH=/ur-timetable/
# =============================================================================

# Node API (same-origin under /timetable/api → no CORS pain)
ProxyPreserveHost On
ProxyPass        /timetable/api  http://127.0.0.1:9000/api
ProxyPassReverse /timetable/api  http://127.0.0.1:9000/api

# Static React build — ONLY this Alias; everything else stays normal htdocs
Alias /timetable "C:/xampp/htdocs/timetable"

<Directory "C:/xampp/htdocs/timetable">
    Options FollowSymLinks
    AllowOverride All
    Require all granted

    # SPA: /timetable/app/... → index.html (React Router)
    RewriteEngine On
    RewriteBase /timetable/
    RewriteRule ^index\.html$ - [L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /timetable/index.html [L]
</Directory>
