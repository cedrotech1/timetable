# ============================================================
# Serve React app at https://huye.ur.ac.rw/timetable/
# (same folder as http://localhost/timetable/)
#
# Install: run enable-huye-timetable.bat as Administrator
# Or manually Include this file from httpd.conf / vhost
# ============================================================

Alias /timetable "C:/xampp/htdocs/timetable"

<Directory "C:/xampp/htdocs/timetable">
    Options FollowSymLinks
    AllowOverride All
    Require all granted

    # Authorization header for JWT (login session)
    CGIPassAuth On
</Directory>

# If XAMPP is on D: or E:, edit the paths above, then restart Apache.
